name: QA and deploy Pages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: claurim-qa-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out development
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm run audit:deps

      - name: Run complete QA gate
        run: npm run gate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload playable build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy QA site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
